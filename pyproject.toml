[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-geo-game-qa-toolkit"
version = "0.1.0"
description = "QA checks for Japanese open-geospatial map packages in games and simulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Japan Geo Game QA Toolkit contributors" }
]
keywords = ["gis", "japan", "unity", "qa", "maps", "open-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: GIS"
]

[project.scripts]
jggqa = "jp_geo_game_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
