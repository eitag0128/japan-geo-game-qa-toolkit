name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate sample manifest
        run: PYTHONPATH=src python -m jp_geo_game_qa validate examples/sample_manifest.json
      - name: Confirm broken fixture is rejected
        run: |
          set +e
          PYTHONPATH=src python -m jp_geo_game_qa validate examples/broken_manifest.json
          status=$?
          set -e
          test "$status" -ne 0
